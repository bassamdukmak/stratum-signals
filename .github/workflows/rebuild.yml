name: Rebuild

on:
  schedule:
    # 22:30 UTC = 18:30 EDT / 17:30 EST, after the 17:00 ET grader either way.
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python build/build.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - run: |
          git diff --quiet || (git config user.name 'stratum-bot' && git config user.email 'bot@users.noreply.github.com' && git commit -am "Nightly snapshot $(date -u +%F)" && git push)
